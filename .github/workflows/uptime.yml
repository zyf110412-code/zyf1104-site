name: Uptime Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check zyf1104.icu
        id: check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://zyf1104.icu/")
          code=${code:-000}
          ms=$(curl -s -o /dev/null -w "%{time_total}" --max-time 20 "https://zyf1104.icu/")
          ms=${ms:-0}
          ms_ms=$(awk "BEGIN{printf \"%.0f\", ${ms} * 1000}")
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p status
          printf '{"t":"%s","code":%s,"ms":%s}\n' "$ts" "$code" "$ms_ms" >> status/history.json
          tail -n 2000 status/history.json > /tmp/history.json && mv /tmp/history.json status/history.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ms=$ms_ms" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "uptime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/history.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "uptime: ${{ steps.check.outputs.code }} (${{ steps.check.outputs.ms }}ms)"
          git push
