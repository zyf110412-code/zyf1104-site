<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站状态 · zyf1104.icu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #faf7f2;
      color: #26302b;
      line-height: 1.6;
      padding: 32px 20px 60px;
    }
    .page { max-width: 860px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    .brand { color: #0f766e; font-weight: 700; text-decoration: none; }
    h1 {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 1.9rem;
      margin: 10px 0 6px;
    }
    header p { color: #5d6b63; font-size: 0.92rem; }
    .card {
      background: #fff;
      border: 1px solid rgba(38, 48, 43, 0.1);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(38, 48, 43, 0.06);
      margin-bottom: 18px;
    }
    .status-card { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .status-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: #d1d5db; flex-shrink: 0;
    }
    .status-dot.ok { background: #16a34a; box-shadow: 0 0 0 6px rgba(22, 163, 74, 0.15); }
    .status-dot.warn { background: #f59e0b; box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.15); }
    .status-dot.down { background: #dc2626; box-shadow: 0 0 0 6px rgba(220, 38, 38, 0.15); }
    .status-text { font-size: 1.15rem; font-weight: 700; }
    .status-meta { color: #5d6b63; font-size: 0.88rem; margin-top: 2px; }
    button {
      margin-left: auto; border: 1px solid rgba(38, 48, 43, 0.15);
      background: #fff; color: #26302b; border-radius: 999px;
      padding: 9px 20px; font-size: 0.9rem; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    button:hover { border-color: #0f766e; color: #0f766e; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .stats .card { text-align: center; margin-bottom: 0; }
    .num { font-size: 1.7rem; font-weight: 800; color: #0f766e; }
    .label { color: #5d6b63; font-size: 0.86rem; margin-top: 4px; }
    h2 { font-size: 1.05rem; margin-bottom: 14px; }
    .bars { display: flex; align-items: flex-end; gap: 5px; height: 110px; }
    .bar {
      flex: 1; min-width: 6px; border-radius: 4px 4px 0 0;
      background: #16a34a; opacity: 0.85; position: relative;
    }
    .bar.bad { background: #dc2626; }
    .bar .tip {
      position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
      background: #26302b; color: #fff; font-size: 0.72rem;
      padding: 3px 7px; border-radius: 6px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    .bar:hover .tip { opacity: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(38, 48, 43, 0.07); }
    th { color: #5d6b63; font-weight: 600; }
    .tag { font-size: 0.78rem; padding: 2px 10px; border-radius: 999px; font-weight: 600; }
    .tag.ok { background: rgba(22, 163, 74, 0.12); color: #16a34a; }
    .tag.warn { background: rgba(245, 158, 11, 0.14); color: #b45309; }
    .tag.down { background: rgba(220, 38, 38, 0.12); color: #dc2626; }
    footer { text-align: center; color: #8a958e; font-size: 0.8rem; margin-top: 10px; }
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
      button { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/">🌱 zyf1104.icu</a>
      <h1>网站状态监控</h1>
      <p>每 15 分钟自动检查一次，历史记录自动保存</p>
    </header>

    <section class="card status-card">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <div class="status-text" id="statusText">正在检查…</div>
        <div class="status-meta" id="statusMeta"></div>
      </div>
      <button id="refreshBtn">立即检查</button>
    </section>

    <section class="stats">
      <div class="card"><div class="num" id="uptime24">--</div><div class="label">近 24 小时在线率</div></div>
      <div class="card"><div class="num" id="uptime7d">--</div><div class="label">近 7 天在线率</div></div>
      <div class="card"><div class="num" id="checkCount">--</div><div class="label">累计检查次数</div></div>
    </section>

    <section class="card">
      <h2>最近 24 次检查（柱高为响应耗时）</h2>
      <div class="bars" id="bars"><div style="color:#5d6b63;font-size:.85rem">加载中…</div></div>
    </section>

    <section class="card">
      <h2>最近检查记录</h2>
      <table>
        <thead><tr><th>时间</th><th>状态</th><th>响应耗时</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="3" style="color:#5d6b63">加载中…</td></tr></tbody>
      </table>
    </section>

    <footer>由 GitHub Actions 自动监控 · 数据仅供参考</footer>
  </div>

  <script>
    (function () {
      var SITE_URL = "/";
      var dot = document.getElementById("statusDot");
      var text = document.getElementById("statusText");
      var meta = document.getElementById("statusMeta");

      function setStatus(state, msg, extra) {
        dot.className = "status-dot " + state;
        text.textContent = msg;
        meta.textContent = extra || "";
      }

      function fmtTime(iso) {
        try {
          return new Date(iso).toLocaleString("zh-CN", { hour12: false });
        } catch (e) {
          return iso;
        }
      }

      function liveCheck() {
        var t0 = performance.now();
        return fetch(SITE_URL + "?live=" + Date.now(), { cache: "no-store" })
          .then(function (res) {
            var ms = Math.round(performance.now() - t0);
            if (res.ok) {
              setStatus("ok", "运行正常", "HTTP " + res.status + " · 响应 " + ms + " ms · " + fmtTime(new Date().toISOString()));
            } else {
              setStatus("warn", "服务异常", "HTTP " + res.status + " · " + fmtTime(new Date().toISOString()));
            }
            return { ok: res.ok, code: res.status, ms: ms };
          })
          .catch(function () {
            setStatus("down", "无法访问", fmtTime(new Date().toISOString()));
            return { ok: false, code: 0, ms: 0 };
          });
      }

      function isUp(code) {
        return code >= 200 && code < 400;
      }

      function render(history) {
        var now = Date.now();
        var day = 24 * 3600 * 1000;
        var last24 = history.filter(function (h) { return now - new Date(h.t).getTime() < day; });
        var last7d = history.filter(function (h) { return now - new Date(h.t).getTime() < 7 * day; });

        document.getElementById("uptime24").textContent = pct(last24);
        document.getElementById("uptime7d").textContent = pct(last7d);
        document.getElementById("checkCount").textContent = history.length;

        var recent = history.slice(-24);
        var maxMs = Math.max.apply(null, recent.map(function (h) { return h.ms; }).concat([1]));
        var bars = document.getElementById("bars");
        bars.innerHTML = "";
        recent.forEach(function (h) {
          var b = document.createElement("div");
          b.className = "bar" + (isUp(h.code) ? "" : " bad");
          var height = Math.max(8, Math.round((h.ms / maxMs) * 100));
          b.style.height = height + "px";
          var tip = document.createElement("span");
          tip.className = "tip";
          tip.textContent = fmtTime(h.t) + " · " + (isUp(h.code) ? "在线" : "离线") + " · " + h.ms + "ms";
          b.appendChild(tip);
          bars.appendChild(b);
        });

        var body = document.getElementById("tableBody");
        body.innerHTML = "";
        history.slice(-20).reverse().forEach(function (h) {
          var tr = document.createElement("tr");
          var tdT = document.createElement("td"); tdT.textContent = fmtTime(h.t);
          var tdS = document.createElement("td");
          var tag = document.createElement("span");
          tag.className = "tag " + (isUp(h.code) ? "ok" : "down");
          tag.textContent = isUp(h.code) ? "在线" : "离线";
          tdS.appendChild(tag);
          var tdM = document.createElement("td"); tdM.textContent = h.ms + " ms";
          tr.appendChild(tdT); tr.appendChild(tdS); tr.appendChild(tdM);
          body.appendChild(tr);
        });
      }

      function pct(arr) {
        if (!arr.length) return "--";
        var up = arr.filter(function (h) { return isUp(h.code); }).length;
        return Math.round((up / arr.length) * 100) + "%";
      }

      function loadHistory() {
        return fetch("history.json", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("history not found");
            return res.text();
          })
          .then(function (text) {
            var history = text.trim().split("\n").filter(Boolean).map(function (line) {
              try { return JSON.parse(line); } catch (e) { return null; }
            }).filter(Boolean);
            render(history);
            return history;
          })
          .catch(function () {
            var bars = document.getElementById("bars");
            bars.innerHTML = '<div style="color:#5d6b63;font-size:.85rem">暂无历史数据，等待第一次自动检查…</div>';
            return [];
          });
      }

      function refresh() {
        liveCheck();
        loadHistory();
      }

      document.getElementById("refreshBtn").addEventListener("click", refresh);
      refresh();
      setInterval(refresh, 60000);
    })();
  </script>
</body>
</html>
